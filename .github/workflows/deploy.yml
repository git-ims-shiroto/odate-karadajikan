name: Deploy theme to server

# main ブランチへの push で、WordPress テーマ（wordpress/odate-karada/）だけをサーバーへ送る。
# 手動実行（Actions タブの "Run workflow"）も可能。

on:
  push:
    branches: [main]
    paths:
      - "wordpress/odate-karada/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# 同時に2つのデプロイが走らないようにする
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  # テーマの設置先（FTP 上の絶対パス。エックスサーバー：/ドメイン/public_html/...）。
  SERVER_DIR: /odate-karadajikan.com/public_html/wp-content/themes/odate-karada/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # FTPS（FTP over TLS）で接続し、テーマフォルダーをサーバーへミラーする。
      # 既存ファイルは上書き。サーバーにだけあるファイルは削除しない（--delete を付けていない）。
      - name: Deploy theme via FTPS (lftp mirror)
        env:
          FTP_HOST: ${{ secrets.OODATE_SECRET_HOST }}
          FTP_USER: ${{ secrets.OODATE_SECRET_USER }}
          LFTP_PASSWORD: ${{ secrets.OODATE_SECRET_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u \"$FTP_USER\" \"$FTP_HOST\";
            echo '--- ログイン直後の場所と一覧（設置先確認用）---';
            pwd;
            cls -1;
            mirror --reverse --verbose --no-perms --parallel=4 \
              --exclude-glob .git* \
              --exclude-glob .DS_Store \
              --exclude-glob Thumbs.db \
              --exclude-glob README.md \
              ./wordpress/odate-karada/ \"$SERVER_DIR\"
          "
