name: Deploy theme to server

# main ブランチへの push で、WordPress テーマ（wordpress/odate-karada/）だけをサーバーへ送る。
# 手動実行（Actions タブの "Run workflow"）も可能。

on:
  push:
    branches: [main]
    paths:
      - "wordpress/odate-karada/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# 同時に2つのデプロイが走らないようにする
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  # テーマの設置先。デプロイ用の追加 FTP アカウントは、接続先ディレクトリを
  # テーマフォルダー（.../public_html/wp-content/themes/odate-karada/）に限定しているため「/」。
  # サーバーパネルの「接続先ディレクトリ」を変えた場合は、ここも合わせて直す。
  SERVER_DIR: /

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # FTPS（FTP over TLS）で接続し、テーマフォルダーをサーバーへミラーする。
      # 既存ファイルは上書き。サーバーにだけあるファイルは削除しない（--delete を付けていない）。
      - name: Deploy theme via FTPS (lftp mirror)
        env:
          FTP_HOST: ${{ secrets.OODATE_SECRET_HOST }}
          FTP_USER: ${{ secrets.OODATE_SECRET_USER }}
          LFTP_PASSWORD: ${{ secrets.OODATE_SECRET_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u \"$FTP_USER\" \"$FTP_HOST\";
            mirror --reverse --verbose --no-perms --parallel=4 \
              --exclude-glob .git* \
              --exclude-glob .DS_Store \
              --exclude-glob Thumbs.db \
              --exclude-glob README.md \
              ./wordpress/odate-karada/ \"$SERVER_DIR\"
          "
